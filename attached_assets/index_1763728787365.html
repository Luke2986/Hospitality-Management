<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookingSuite - Hospitality Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              // Dashboard Theme (Default)
              primary: {
                DEFAULT: 'hsl(220, 90%, 56%)',
                foreground: 'hsl(0, 0%, 100%)',
              },
              secondary: {
                DEFAULT: 'hsl(280, 80%, 60%)',
                foreground: 'hsl(0, 0%, 100%)',
              },
              accent: {
                DEFAULT: 'hsl(142, 70%, 45%)',
                foreground: 'hsl(0, 0%, 100%)',
              },
              background: 'hsl(0, 0%, 100%)',
              card: 'hsl(0, 0%, 98%)',
              text: 'hsl(222, 47%, 11%)',
              muted: 'hsl(215, 16%, 47%)',
              
              // Widget Specifics (Warm)
              widget: {
                primary: 'hsl(25, 95%, 53%)',
                secondary: 'hsl(340, 82%, 52%)', 
                accent: 'hsl(43, 100%, 51%)',
                background: 'hsl(0, 0%, 100%)',
                card: 'hsl(20, 14%, 96%)',
                text: 'hsl(24, 10%, 10%)',
                muted: 'hsl(24, 5%, 50%)',
              }
            },
            borderRadius: {
              lg: '1rem',
              xl: '1.5rem',
            },
            keyframes: {
              'enter-from-right': {
                '0%': { transform: 'translateX(20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              'enter-from-left': {
                '0%': { transform: 'translateX(-20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              }
            },
            animation: {
              'enter-from-right': 'enter-from-right 0.3s ease-out',
              'enter-from-left': 'enter-from-left 0.3s ease-out',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^3.4.0",
    "date-fns": "https://aistudiocdn.com/date-fns@^3.3.1",
    "date-fns/locale": "https://aistudiocdn.com/date-fns@^3.3.1/locale",
    "canvas-confetti": "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/+esm",
    "date-fns/": "https://aistudiocdn.com/date-fns@^4.1.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
